# Mantiene despierto el proyecto Supabase (tier gratis) — y lo despierta solo si igual se pausó.
#
# Supabase PAUSA los proyectos gratuitos por inactividad. La Primada se usa un día al mes.
# Historia: hasta nov 2026 esto hacía UNA LECTURA anónima cada 2 días, y el 18 nov el proyecto amaneció
# pausado igual (la lectura del 17 había respondido 200). Leer no le basta a Supabase como actividad, y su
# regla exacta no es pública. Por eso ahora hay DOS defensas, todos los días:
#   1) Si el proyecto está pausado, lo REACTIVA por la API de gestión y deja el job en ROJO (GitHub manda
#      correo). Necesita el secreto SUPABASE_ACCESS_TOKEN (token personal de Supabase); sin él, se salta.
#   2) ESCRIBE un latido (RPC keepalive_latido, ver supabase/keepalive.sql) en vez de solo leer.
#
# La anon key es PÚBLICA por diseño (ya viaja en js/config.js); nunca usar acá la service_role.
# Ojo: GitHub desactiva los workflows programados si el repo pasa 60 días sin commits. Si eso pasa, llega un
# correo de GitHub; se reactiva desde la pestaña Actions con un clic.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 13 * * *'     # todos los días, 13:17 UTC (8:17 a. m. en Colombia)
  workflow_dispatch: {}       # botón "Run workflow" para probarlo a mano

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REF: iaxlefbmtgowtusghwkz
      SUPABASE_URL: https://iaxlefbmtgowtusghwkz.supabase.co
      SUPABASE_ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlheGxlZmJtdGdvd3R1c2dod2t6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyOTU2NDgsImV4cCI6MjA5NTg3MTY0OH0.grK-ZTUCTQbo9GMUo1o6U2y6FDODcpwtfjK_7tct95c
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Si está pausado, reactivarlo
        id: estado
        run: |
          if [ -z "$TOKEN" ]; then echo "Sin SUPABASE_ACCESS_TOKEN: no se puede revisar el estado"; exit 0; fi
          estado=$(curl -s --retry 3 "https://api.supabase.com/v1/projects/$REF" -H "Authorization: Bearer $TOKEN" | jq -r .status)
          echo "Estado del proyecto: $estado"
          if [ "$estado" = "INACTIVE" ]; then
            curl -s -X POST --retry 3 "https://api.supabase.com/v1/projects/$REF/restore" -H "Authorization: Bearer $TOKEN"
            echo "reactivado=1" >> "$GITHUB_OUTPUT"
            for i in $(seq 1 40); do
              estado=$(curl -s "https://api.supabase.com/v1/projects/$REF" -H "Authorization: Bearer $TOKEN" | jq -r .status)
              echo "…$estado"; [ "$estado" = "ACTIVE_HEALTHY" ] && break; sleep 15
            done
          fi

      - name: Escribir el latido
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 20 -X POST \
            "$SUPABASE_URL/rest/v1/rpc/keepalive_latido" \
            -H "apikey: $SUPABASE_ANON" -H "Authorization: Bearer $SUPABASE_ANON" -H "Content-Type: application/json" -d '{}')
          echo "Latido: Supabase respondió $code"
          test "$code" = "200"

      - name: Avisar que se había pausado
        if: steps.estado.outputs.reactivado == '1'
        run: |
          echo "::error::Supabase estaba PAUSADO y se reactivó solo. La app ya funciona; revisar si se repite."
          exit 1
