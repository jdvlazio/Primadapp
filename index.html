       1) version.json (sellado en cada deploy por scripts/stamp-sw.js) se consulta NO-STORE al ABRIR
          y al VOLVER de background; si el build difiere del guardado → location.reload() duro. Es
          INDEPENDIENTE del SW → la garantía real de que el celular toma la versión nueva.
       2) controllerchange (no-iOS) → reload cuando un SW nuevo toma control.
       3) reg.update() al volver de background → re-verifica sw.js contra el servidor. -->
  <script>
    // MODELO UNIFICADO (decisión: nativo = server.url cargando el sitio VIVO, SIN OTA/Capgo). Como el
    // nativo carga el mismo sitio que la web, el SW es la ÚNICA autoridad de actualización en TODOS los
    // runtimes (PWA + iOS + Android). Por eso el SW se registra y el poll de versión corre SIEMPRE — no
    // se gatea por plataforma. (Con server.url no hay bundle embebido viejo → el poll no puede loopear.)
    if ('serviceWorker' in navigator) {
      // updateViaCache:'none' → el navegador NUNCA sirve sw.js desde su caché HTTP al chequear
      // updates; siempre lo baja fresco y DETECTA el SW nuevo. Sin esto, iOS servía el sw.js
      // cacheado y nunca veía el cambio → el device quedaba pegado a un SW viejo.
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(function () {});
      });
    }

    (function () {
      // BUILD = build de ESTE HTML (meta sellado). Es la VERDAD de qué versión corre — NO localStorage,
      // que podía quedar "mintiendo" (guardaba el build nuevo antes de confirmar que el reload trajo el
      // HTML nuevo; si el CDN servía viejo, el check veía "coinciden" y nunca recargaba → atasco).
      var BUILD = (document.querySelector('meta[name="build"]') || {}).content || '';
      var TRY = 'laPrimada_vtry';        // reloads por sesión (anti-loop si el CDN aún sirve viejo)
      var reloading = false;
      var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

      function checkVersion() {
        if (typeof fetch !== 'function' || reloading || !BUILD) return;  // jsdom/dev sin build sellado
        fetch('version.json?cb=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { return r.json(); })
          .then(function (v) {
            var server = (v && v.build) || '';
            if (!server) return;
            if (server !== BUILD) {
              // El HTML que corre NO es el del servidor → recargar para traerlo. Compara contra el build
              // INCRUSTADO (no localStorage) → se autosana cuando el reload trae el HTML nuevo (no se atasca).
              var tries = +(sessionStorage.getItem(TRY) || 0);
              if (tries < 3) {           // tope por sesión: si el CDN aún sirve viejo, sin loop infinito
                sessionStorage.setItem(TRY, tries + 1);
                reloading = true;
                location.reload();
              }
            } else {
              sessionStorage.removeItem(TRY);   // ya corremos la versión del servidor
            }
          })
          .catch(function () {});
      }

      if ('serviceWorker' in navigator && !isIOS) {
        var hadController = !!navigator.serviceWorker.controller;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (hadController && !reloading) { reloading = true; location.reload(); }
          hadController = true;
        });
      }

      // (El posicionamiento de la tabbar lo resuelve --app-height arriba: .app a la altura real del
      //  viewport y la barra como hijo flex al fondo. No hace falta tocar la barra aquí.)

      checkVersion();                               // 1) cold start
      document.addEventListener('visibilitychange', function () {   // 1+3) volver de background
        if (document.visibilityState === 'visible' && !reloading) {
          checkVersion();
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.ready.then(function (reg) { reg.update(); }).catch(function () {});
          }
        }
      });
    })();
  </script>
</body>
</html>
